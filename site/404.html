<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | RightSkills</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23818cf8'>⚡</text></svg>">
    <link rel="stylesheet" href="/shared.css">
</head>
<body class="bg-[#09090b] text-[#fafafa] min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <span class="text-2xl">⚡</span>
                <span class="text-xl font-bold tracking-tight text-white">RightSkills</span>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm">
                <a href="/catalog" class="text-zinc-400 hover:text-white transition">Catalog</a>
                <a href="/stacks" class="text-zinc-400 hover:text-white transition">Stacks</a>
                <a href="/submit" class="text-zinc-400 hover:text-white transition">Submit</a>
                <a href="/sponsor" class="text-zinc-400 hover:text-white transition">Sponsor</a>
            </nav>
        </div>
    </header>

    <!-- 404 Hero Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-20 text-center">
        <div class="max-w-md mx-auto">
            <div class="text-6xl font-extrabold text-indigo-400 mb-4">404</div>
            <h1 class="text-2xl font-bold mb-3">Page Not Found</h1>
            <p class="text-zinc-400 text-sm mb-8">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <div class="flex items-center justify-center gap-4">
                <a href="/" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-sm transition shadow-lg shadow-indigo-600/20">
                    Return Home
                </a>
                <a href="/catalog" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg font-medium text-sm transition border border-zinc-700">
                    Browse Catalog
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#09090b] border-t border-zinc-800/60 py-8 px-4 text-center text-xs text-zinc-500">
        <p>&copy; 2026 RightSkills. Open source agent skill registry.</p>
    </footer>
</body>
</html>
